<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Sign up form</title>
</head>

<body>
  <div class="container">
    <div class="left">
      <img src="leaf.avif" alt="leaf">
      <div class="overlay">
        <img src="odin-lined.png" alt="Odin Logo">
        <h1>ODIN</h1>
      </div>
      <div class="credits">
        <p>Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></p>
      </div>
    </div>
    <div class="right">
      <div class="top">
        <p>This is not a real online service!You know you need something like this in your life to help you realize your
          deepest dreams.</p>
        <p>Sign up <span>now</span> to get started</p>
        <p>You <span>know</span> you want to.</p>
      </div>
      <div class="middle">
        <h2>Let's do this!</h2>
        <form action="" method="post">
          <fieldset>
            <div>
              <label for="fname">FIRST NAME</label>
              <input type="text" name="fname" id="fname" required pattern="[a-zA-Z]">
            </div>
            <div>
              <label for="email">EMAIL</label>
              <input type="email" name="email" id="email" required>
            </div>
            <div>
              <label for="pswd">PASSWORD</label>
              <input type="password" name="pswd" id="pswd" required minlength="8">
            </div>
          </fieldset>
          <fieldset>
            <div>
              <label for="lname">LAST NAME</label>
              <input type="text" name="lname" id="lname" required pattern="[a-zA-Z]">
            </div>
            <div>
              <label for="number">PHONE NUMBER</label>
              <input type="tel" name="number" id="number" required minlength="10" maxlength="10">
            </div>
            <div>
              <label for="pswd2">CONFIRM PASSWORD</label>
              <input type="password" name="pswd2" id="pswd2" required minlength="8">
            </div>
          </fieldset>
        </form>
      </div>
      <div class="bottom">
        <button type="button">Create Account</button>
        <p>Already have an account?<span><a href=""> Log in</a></span></p>
      </div>
    </div>
  </div>
</body>

</html>
